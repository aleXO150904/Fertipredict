spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fertipredict}
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.properties.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
ml.api.url=${ML_API_URL:http://localhost:8000}
# Recovery is enabled only after configuring an SMTP sender and the frontend URL.
app.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.password-reset.frontend-url=${FRONTEND_URL:https://fertipredict.vercel.app/}
app.password-reset.from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
